name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: Build (all packages)
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        # Skipped tests need a real Docker/Kubernetes/WSL environment or DNS,
        # or are timing-flaky on shared runners: command-hook tests spawn a
        # subprocess against a 2s deadline, and the WebSocket session test can
        # observe an abnormal close (1006) when the event loop is CPU-throttled.
        # All pass locally and under -race. Remove --skip to run everything.
        run: >-
          go test
          -skip 'TestKubernetes|TestDocker|TestWSL|TestNativeRuntime|TestOriginRuntimeValidate|TestAcceptExpectedPeerResolvesDNSName|TestLoadFileRunsCommandHook|TestLoadHooksFileRunsBoundedCommand|TestSessionRuntimeOverNegotiatedWebSocket'
          ./...

  cross-build:
    # Proves the release matrix compiles on every target (cgo-free). Keep this
    # list in sync with builds.targets in .goreleaser.yaml.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: "386" }
          - { goos: linux,   goarch: ppc64le }
          - { goos: linux,   goarch: s390x }
          - { goos: linux,   goarch: riscv64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm64 }
          - { goos: openbsd, goarch: amd64 }
          - { goos: openbsd, goarch: arm64 }
          - { goos: netbsd,  goarch: amd64 }
          - { goos: netbsd,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: Build wv
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./cmd/wv
