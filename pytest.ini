[pytest]
testpaths = tests
pythonpath = .
markers =
    sshx11: SSH/X11 workbench test scope.
    unit: Unit tests.
    contract: Contract validation tests.
    system: System-level tests.
    performance: Performance tests.
    resilience: Resilience tests.
    security: Security policy tests.
    reporting: Reporting and artifact tests.
    jepsen: Jepsen-based distributed fault-injection test infrastructure.
